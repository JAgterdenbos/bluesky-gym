# cps_coordination/configs/cps_scale_10k.yaml
# ----------------------------------------
# Production configuration for the M=2,000-episode CPS coordination
# scale-up evaluation (Phase III roadmap Step 10 — rescaled from the
# original M=10,000/low-density config toward higher per-episode traffic
# density and fewer episodes; see cps_eval: below and the "Density
# rescale" section of step10_execution_and_data_collection_plan.md).
#
# This is a config + launch-script generation step only — it is NOT meant
# to be run locally end-to-end. Use
# cps_coordination/scripts/run_batch_eval.py to launch the sweep on a
# cluster/runner, and cps_coordination/testing/smoke_test_step10.py for a
# capped local M=10 sanity check. See
# .claude/step10_execution_and_data_collection_plan.md for the full
# handoff instructions.
#
# Priority chain: dataclass defaults -> this YAML file -> CLI flags.
#
# Note on scope: unlike cps_base.yaml's `model.k_cps`/`model.
# runway_assignment_mode`, this config intentionally leaves those two
# fields at their CPSModelConfig defaults — run_batch_eval.py sweeps both
# per the --k-cps-sweep/--mode-sweep CLI flags (k_cps in {0,3} x mode in
# {static,dynamic}, 4 combinations).
#
# A `model.fairness_weight` k-CPS slack-protection term used to be
# calibrated per-mode here (static≈1.0, dynamic≈0.5, via
# analyze_fairness_weight_offline.py's Stage 1/2 sweep). Removed
# 2026-08-12: .claude/plans/stall_rate_investigation.md found
# fairness_weight=0.0 (exact FCFS ordering) matched or beat every tested
# nonzero value, in both modes, at every congestion level -- the earlier
# calibration was run in an artificial "ratchet ON" regime just to get any
# stall signal at all (see that plan doc's "Resolved: why the earlier
# calibration and this investigation disagree" section), a regime that
# doesn't reflect real (ratchet-OFF) production behavior. The mechanism
# itself was removed from CPSManager rather than just defaulted to 0.

model:
  # CPS coordination hyper-parameters. k_cps / runway_assignment_mode are
  # NOT set here - run_batch_eval.py (via run_step10_scale10k.sh) overrides
  # them per sweep combination.
  delta_t_plan: 120               # Aligned with ACTION_TIME=120s (avoids the
                                   # CPSModelConfig.validate() cadence-mismatch warning)
  delta_update: 1.0               # Minimum TTA change delta_update to push a worker update (s)
  eta_surrogate_path: cps_coordination/models/eta_surrogate.pkl

  # Inherited from ModelConfig - not used for training; kept for framework compatibility
  learning_rate: 0.0003
  verbose: 1

session:
  total_timesteps: 0              # No training steps; evaluation-only experiment
  do_train: false
  do_evaluate: true
  eval_episodes: 2000             # M = 2,000 per (k_cps, runway_assignment_mode) combination.
                                   # Reduced from 10,000 in favor of higher per-episode traffic
                                   # density (see cps_eval: below) — see the "Density rescale"
                                   # section of step10_execution_and_data_collection_plan.md.

  # Point at a pre-trained path_planning run to use as the frozen worker policy.
  # Must be overridden at runtime - there is no default worker checkpoint baked
  # into this file:  --run-id 20260301_120000  (run_batch_eval.py CLI flag)
  pretrained_run_id: null
  pretrained_model_path: null
  pretrained_model_variant: final_model

  train_groups: null
  eval_groups: null
  eval_freq: 5000
  track_training_evals: false
  callbacks:
    - csv_logger

env:
  # Experiment-path namespace only (./experiments/{env_name}/...) - NOT the
  # frozen worker's gym.make() id. See CPSEnvConfig's docstring.
  env_name: CPSCoordination
  group_key: current_runway
  success_key: is_success

  env_kwargs:
    action_mode: hdg
    runways: ["18R", "27"]  # Groot et al.'s dual-runway baseline scope,
                             # confirmed 2026-08-06 from hierarchical_RL_arrival_draft.pdf
                             # (was null/all-12 -- see phase3_cps_coordination_plan.md,
                             # "Runway scope confirmed from Groot et al.")

# ──────────────────────────────────────────────────────────────────────────────
# RECAT-EU separation matrix: intentionally NOT duplicated here. run_batch_eval.py
# (like run_cps_eval.py and CPSCoordinationExperiment._load_recat_matrix) loads
# the recat_eu matrix from cps_base.yaml, so there is a single source of truth
# for the separation values and a future matrix edit only needs to be made once.
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# CPS evaluation parameters (read directly by run_batch_eval.py / by
# CPSCoordinationExperiment.evaluate() via _cfg_or_default/_get_n_aircraft).
#
# This extends cps_base.yaml's existing cps_eval: section with the env-sizing
# and spawn-timing knobs Step 10 needs. There is deliberately no CPSEvalConfig
# dataclass - n_aircraft_per_episode et al. already live in this free-form
# section (see CPSCoordinationExperiment._get_n_aircraft/_cfg_or_default), so
# the new keys below follow that same established pattern rather than
# inventing a dataclass that doesn't fit the framework.
# ──────────────────────────────────────────────────────────────────────────────
cps_eval:
  n_aircraft_per_episode: 5       # Legacy single-wave field. Dead in this file:
                                   # CPSCoordinationExperiment._get_n_aircraft()
                                   # hardcodes a read from cps_base.yaml regardless
                                   # of which --config is passed, so this copy is
                                   # never read even under evaluate(). Kept only
                                   # so this file documents the same cps_eval:
                                   # shape as cps_base.yaml. run_batch_eval.py
                                   # uses max_concurrent_aircraft/
                                   # total_arrivals_per_episode below instead.
  max_concurrent_aircraft: 35     # Maximum simultaneously active aircraft ("slots").
                                   # Raised from 10 -> 35 (2026-08-13): resolved by the
                                   # 50-ac/episode capacity sweep (candidate caps
                                   # {10,20,27,35,42,50,65,80}, pre-registered <10%-of-
                                   # cumulative-Gamma-range stopping rule) -- see
                                   # phase3_cps_coordination_plan.md's "Density Rescale
                                   # to 50 ac/episode" section for the full table/derivation.
  total_arrivals_per_episode: 50  # Total arrivals generated per episode (rolling
                                   # arrival stream: > max_concurrent_aircraft means
                                   # later arrivals spawn into slots as they free up).
                                   # Raised from 25 -> 50 (2x, matching the 4D worker's
                                   # N=100,000-aircraft results section at M=2,000
                                   # unchanged) -- see "Density Rescale to 50 ac/episode"
                                   # in phase3_cps_coordination_plan.md.
  spawn_window_s: 2400.0          # Each arrival's scheduled spawn time is drawn
                                   # i.i.d. Uniform(0, spawn_window_s) at episode
                                   # reset (MultiAgentPathPlanningGoalEnv's
                                   # spawn_window_s param) - models arrivals
                                   # entering the sector over a 40-minute window
                                   # rather than all at once. Raised from 1800 ->
                                   # 2400 (not held fixed) so arrival cadence still
                                   # tightens (180s/arrival -> 96s/arrival) against
                                   # the larger concurrent-slot pool above, rather
                                   # than becoming degenerate.
  separation_tolerance_s: 5.0     # Slack (s) within which C_sep compliance is credited
  rta_tolerance_s: 60.0           # delta_t (Eq. recovery_rate): R_rec's RTA tolerance
  ripple_lag: 1                   # Lag for rho_ripple autocorrelation (always 1 per methodology)
  throughput_window_h: 1.0        # Time window (hours) for Gamma / Gamma_r calculation

  # wake_cat is NOT a config field: it is hardcoded to "C" in
  # coordination_baseline.py::_build_fleet (uniform-aircraft-type assumption,
  # confirmed intentional for this thesis phase - see project memory). There is
  # nothing to set here; documented for anyone looking for a fixed_wake_cat knob.

# ──────────────────────────────────────────────────────────────────────────────
# Telemetry / logging parameters, read by run_batch_eval.py.
# ──────────────────────────────────────────────────────────────────────────────
logging:
  chunk_size: 250                 # Episodes buffered per Parquet flush (per combo,
                                   # per stream - see telemetry.py::build_collectors)
  three_pass_static_solo: true    # Documents that the CPS pass, the static-TTA pass
                                   # (same greedy-scheduled TTA, assigned once and
                                   # frozen - Eq. tracking_degradation/RQ2.2), and the
                                   # unconstrained solo pass all run per episode
                                   # (coordination_baseline.py::_run_episode's
                                   # tta_mode="cps"/"static"/"solo") - there is no
                                   # single- or two-pass mode today, so this is
                                   # descriptive rather than a live toggle. This is a
                                   # 3x, not 2x, per-episode compute cost versus a
                                   # single-pass baseline.
