# cps_coordination/configs/cps_base.yaml
# ----------------------------------------
# Default configuration for CPSCoordinationExperiment.
#
# Priority chain: dataclass defaults → this YAML file → CLI flags.
#
# Load with:
#   python -m cps_coordination train --config cps_coordination/configs/cps_base.yaml

model:
  # CPS coordination hyper-parameters
  k_cps: 3                        # Maximum positional shift from FCFS rank (k-CPS window)
  delta_t_plan: 60                # Replanning interval ΔT_plan (simulation seconds)
  delta_update: 1.0               # Minimum TTA change δ_update to push a worker update (s)
  runway_assignment_mode: dynamic # "static" | "dynamic"
  eta_surrogate_path: null        # Path to a fitted ETASurrogate (.pkl); null → fall back to
                                   # cps_coordination/models/eta_surrogate.pkl if it exists

  # Inherited from ModelConfig — not used for training; kept for framework compatibility
  learning_rate: 0.0003
  verbose: 1

session:
  total_timesteps: 0              # No training steps; evaluation-only experiment
  do_train: false
  do_evaluate: true
  eval_episodes: 50

  # Point at a pre-trained path_planning run to use as the frozen worker policy.
  # Override at runtime:  --session-pretrained-run-id 20260301_120000
  pretrained_run_id: null
  pretrained_model_path: null
  pretrained_model_variant: final_model

  train_groups: null
  eval_groups: null
  eval_freq: 5000
  track_training_evals: false
  callbacks:
    - csv_logger

env:
  # Experiment-path namespace only (./experiments/{env_name}/...) — NOT the
  # frozen worker's gym.make() id. Deliberately distinct from
  # "PathPlanningGoalEnv-v0" so CPS eval runs don't write into that env's own
  # training-run directory tree. See CPSEnvConfig's docstring.
  env_name: CPSCoordination
  group_key: current_runway
  success_key: is_success

  env_kwargs:
    action_mode: hdg
    runways: null           # null → use all available runways

# ──────────────────────────────────────────────────────────────────────────────
# RECAT-EU time-based separation matrix (seconds)
# Source: EUROCONTROL RECAT-EU distance-based minima (\cite{eurocontrol_recat_2024}),
# converted to time via T = D_NM * 1852 / v, v = 125 m/s (the SPEED constant used by
# pathplanning_goal_env.py / pathplanning_goal_env_heading.py, i.e. the speed the frozen
# worker policy was trained under). MRS floor of 2.5 NM per ICAO Doc 4444
# (\cite{icao_doc4444_2007}) applies to C/D/E against each other.
#
# Matrix convention:
#   recat_eu[leading_wake_category][trailing_wake_category] = separation (s)
#
# Wake turbulence categories:
#   A = Super-heavy    (e.g. A380, AN-124)
#   B = Upper-heavy    (e.g. B747, B777)
#   C = Lower-heavy    (e.g. B767, A330)
#   D = Upper-medium   (e.g. B737-900, A321, A320)
#   E = Lower-medium   (e.g. B737-700)
#   F = Light          (e.g. C172, PA28)
# ──────────────────────────────────────────────────────────────────────────────
recat_eu:
  A:
    A:  44.45
    B:  59.26
    C:  74.08
    D:  74.08
    E:  88.90
    F: 118.53
  B:
    A:  37.04
    B:  44.45
    C:  59.26
    D:  59.26
    E:  74.08
    F: 103.71
  C:
    A:  37.04
    B:  37.04
    C:  37.04
    D:  44.45
    E:  44.45
    F:  59.26
  D:
    A:  37.04
    B:  37.04
    C:  37.04
    D:  37.04
    E:  37.04
    F:  74.08
  E:
    A:  37.04
    B:  37.04
    C:  37.04
    D:  37.04
    E:  37.04
    F:  59.26
  F:
    A:  37.04
    B:  37.04
    C:  37.04
    D:  37.04
    E:  37.04
    F:  44.45

# ──────────────────────────────────────────────────────────────────────────────
# CPS evaluation parameters (read by CPSCoordinationExperiment.evaluate())
# ──────────────────────────────────────────────────────────────────────────────
cps_eval:
  n_aircraft_per_episode: 5       # N_a: simultaneous aircraft per episode
  separation_tolerance_s: 5.0     # Slack (s) within which C_sep compliance is credited
  rta_tolerance_s: 60.0           # delta_t (Eq. recovery_rate): R_rec's RTA tolerance
  ripple_lag: 1                   # Lag for ρ_ripple autocorrelation (always 1 per methodology)
  throughput_window_h: 1.0        # Time window (hours) for Γ / Γ_r calculation
